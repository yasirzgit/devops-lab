name: CI

on: 
  push: 
    branches: [main]
  pull_request: 
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run test command
        run: echo "GitHub Actions is working"
  test:
    needs: hello
    if: ${{ github.ref == 'refs/heads/main' }}   
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        run: echo "This is the test job"    